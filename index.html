<!DOCTYPE html>

<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待办事项</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

:root {
  --bg: #f4f1ec;
  --surface: #ffffff;
  --text: #1a1a1a;
  --text-muted: #8a8580;
  --accent: #d45a3a;
  --accent-hover: #be4528;
  --border: #e4dfd8;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 4px 6px rgba(0, 0, 0, 0.04), 0 12px 32px rgba(0, 0, 0, 0.08);
  --radius: 12px;
}

body {
  font-family: "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 60px 20px 80px;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(212, 90, 58, 0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(58, 130, 212, 0.04) 0%, transparent 50%);
}

.app {
  width: 100%;
  max-width: 520px;
  animation: fadeUp 0.6s ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Header ── */
.header {
  margin-bottom: 36px;
  text-align: center;
}

.header h1 {
  font-family: "DM Serif Display", serif;
  font-size: 2.6rem;
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--text);
}

.header p {
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--text-muted);
  font-weight: 400;
}

/* ── Input Area ── */
.input-area {
  display: flex;
  gap: 10px;
  margin-bottom: 32px;
}

.input-area input {
  flex: 1;
  padding: 14px 18px;
  font-size: 0.95rem;
  font-family: inherit;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.input-area input::placeholder {
  color: var(--text-muted);
}

.input-area input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(212, 90, 58, 0.1);
}

.btn-add {
  padding: 14px 24px;
  font-size: 0.95rem;
  font-family: inherit;
  font-weight: 500;
  border: none;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
}

.btn-add:hover {
  background: var(--accent-hover);
  box-shadow: 0 4px 14px rgba(212, 90, 58, 0.3);
}

.btn-add:active {
  transform: scale(0.96);
}

/* ── Task List ── */
.task-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.task-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  animation: slideIn 0.35s ease-out;
  transition: box-shadow 0.2s, border-color 0.2s;
}

.task-item:hover {
  box-shadow: var(--shadow-lg);
  border-color: #d8d3cc;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.task-index {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-muted);
  flex-shrink: 0;
}

.task-title {
  flex: 1;
  font-size: 0.95rem;
  line-height: 1.5;
  word-break: break-word;
}

.btn-delete {
  padding: 6px 14px;
  font-size: 0.8rem;
  font-family: inherit;
  font-weight: 500;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
}

.btn-delete:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(212, 90, 58, 0.06);
}

/* ── Empty State ── */
.empty-state {
  text-align: center;
  padding: 52px 20px;
  color: var(--text-muted);
  animation: fadeUp 0.5s ease-out;
}

.empty-icon {
  font-size: 2.4rem;
  margin-bottom: 12px;
  opacity: 0.5;
}

.empty-state p {
  font-size: 0.9rem;
}

/* ── Counter ── */
.counter {
  text-align: center;
  margin-top: 24px;
  font-size: 0.8rem;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}

/* ── Error Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  padding: 12px 24px;
  background: #1a1a1a;
  color: #fff;
  font-size: 0.85rem;
  border-radius: 10px;
  opacity: 0;
  transition: all 0.35s ease;
  pointer-events: none;
  z-index: 100;
}

.toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>To‑Do</h1>
      <p>记录你的每一件小事</p >
    </div>


<div class="input-area">
  <input id="taskInput" type="text" placeholder="输入新任务…" autocomplete="off" />
  <button class="btn-add" onclick="addTodo()">添加</button>
</div>

<div class="task-list" id="taskList"></div>
<div class="counter" id="counter"></div>


  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = "http://localhost:3000/todos";

    // ── 获取任务列表 ──
    async function fetchTodos() {
      try {
        const res = await fetch(API);
        const todos = await res.json();
        render(todos);
      } catch {
        showToast("⚠ 无法连接后端，请确认服务已启动");
      }
    }

    // ── 添加任务 ──
    async function addTodo() {
      const input = document.getElementById("taskInput");
      const title = input.value.trim();
      if (!title) return input.focus();

      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title }),
        });

        if (!res.ok) {
          const err = await res.json();
          return showToast(err.error || "添加失败");
        }

        input.value = "";
        input.focus();
        fetchTodos();
      } catch {
        showToast("⚠ 网络错误");
      }
    }

    // ── 删除任务 ──
    async function deleteTodo(id) {
      try {
        await fetch(`${API}/${id}`, { method: "DELETE" });
        fetchTodos();
      } catch {
        showToast("⚠ 删除失败");
      }
    }

    // ── 渲染列表 ──
    function render(todos) {
      const list = document.getElementById("taskList");
      const counter = document.getElementById("counter");

      if (todos.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <p>暂无待办事项，添加一个吧</p >
          </div>`;
        counter.textContent = "";
        return;
      }

      list.innerHTML = todos
        .map(
          (t, i) => `
          <div class="task-item">
            <span class="task-index">${i + 1}</span>
            <span class="task-title">${escapeHtml(t.title)}</span>
            <button class="btn-delete" onclick="deleteTodo(${t.id})">删除</button>
          </div>`
        )
        .join("");

      counter.textContent = `共 ${todos.length} 项任务`;
    }

    // ── 工具函数 ──
    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("visible");
      setTimeout(() => el.classList.remove("visible"), 2500);
    }

    // 回车键添加
    document.getElementById("taskInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTodo();
    });

    // 初始化
    fetchTodos();
  </script>

</body>
</html>
